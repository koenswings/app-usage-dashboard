app: usage-dashboard
idea_app_version: "1.0"

compatibility:
  engine_min: "0.9.0"
  engine_tested: "unknown"

services:
  - name: tailscale
    build: official
    upstream: tailscale/tailscale
    upstream_tag: "v1.88.3"
    image: tailscale/tailscale
    current_version: "v1.88.3"
    notes: >
      Userspace sidecar tagged tag:idea-hub. Official multi-arch image.
      Do not publish a retag until a field image is needed.
    monitors:
      - kind: dockerhub
        repo: tailscale/tailscale
        tag_pattern: "^v\\d+\\.\\d+\\.\\d+$"

  - name: collector
    build: custom
    upstream: python
    upstream_tag: "3.12-slim-bookworm"
    image: ghcr.io/koenswings/usage-dashboard-collector
    current_version: "1.4"
    notes: >
      Baked image FROM the pinned python:3.12-slim-bookworm digest plus
      openssh-client, netcat-openbsd and tzdata (idea#461). Shipped as a
      service tar and pinned by digest, like web. entrypoint.sh never
      installs packages. ./collector stays bind-mounted at /app.

  - name: web
    build: official
    upstream: nginx
    upstream_tag: "1.28-alpine"
    image: nginx
    current_version: "1.28-alpine"
    notes: Official multi-arch nginx serving Pixel's UI (or the placeholder) and proxying /api/.
