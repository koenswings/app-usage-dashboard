x-app:
  name: usage-dashboard
  title: Field usage dashboard
  description: >
    Programme field-usage dashboard for idea. Owns the idea-hub Tailscale
    identity (idea-hub, tag:idea-hub) via a userspace sidecar and pulls kit
    usage summaries into SQLite. Install only on idea (system disk, via
    installApp), never on a school kit. Only one idea-hub container may
    ever exist; move sidecar state, never copy it.
  url: https://github.com/koenswings/app-usage-dashboard
  category: admin
  icon: icon.png
  author: Koen Swings
  version: "1.0"
  instanceName: usage-dashboard
  healthCheck:
    path: /api/v1/health
    expect: '"ok"'
  healthTimeout: 180
  updatesFrom: []
  migrationNote: >
    First release. The collector creates SQLite on first start under ./data.
  snapshotExclude: []
  backup:
    exclude:
      - keys
      - tailscale

services:
  tailscale:
    # Official multi-arch index digest (idea#322). linux/arm64 verified 2026-11-11.
    # This service owns the idea-hub Tailscale identity (hostname idea-hub,
    # tag:idea-hub). State lives only in ./data/tailscale. Move that directory
    # when handing the identity between containers — never copy it. Whichever
    # container runs last owns the live node key; a leftover copy goes stale
    # (NeedsLogin / nodeKeyExpired). Only one idea-hub container may ever exist.
    # TS_EXTRA_ARGS already advertises tag:idea-hub. TS_STATE_DIR must equal
    # the bind-mount target (/var/lib/tailscale). TS_AUTH_ONCE=true stops
    # containerboot forcing `tailscale up` on every start. TS_KUBE_SECRET is
    # cleared so state cannot drift to a kube store. Leave TS_AUTHKEY empty
    # when reusing existing state; do not re-auth. sidecar-wrap refuses to
    # start with empty state unless TS_AUTHKEY is set.
    image: tailscale/tailscale:v1.88.3@sha256:b2a19f6b6402adc26a2aa8cb90da66afe3061e718ac67ed3f21ec3d4b366439f
    labels:
      x-app-version: "1.0"
    hostname: idea-hub
    restart: unless-stopped
    pull_policy: never
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_KUBE_SECRET=
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SOCKS5_SERVER=127.0.0.1:1055
      - TS_LOCAL_ADDR_PORT=127.0.0.1:8384
      - TS_EXTRA_ARGS=--advertise-tags=tag:idea-hub
      - TS_HOSTNAME=${TS_HOSTNAME:-idea-hub}
      - TS_ACCEPT_DNS=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./collector/sidecar-wrap.sh:/sidecar-wrap.sh:ro
    entrypoint: ["/bin/sh", "/sidecar-wrap.sh"]
    # State file must exist (or TS_AUTHKEY for a one-time join). sidecar-wrap
    # refuses an empty start. This healthcheck confirms the bind-mounted state
    # is still present and containerboot reached Running; script/check-idea-hub-nodekey.py
    # compares the derived on-disk nodekey with Self.PublicKey.
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /var/lib/tailscale/tailscaled.state && grep -q PrivateNodeKey /var/lib/tailscale/tailscaled.state && tailscale --socket=/tmp/tailscaled.sock status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  collector:
    # Official multi-arch index digest (idea#322). linux/arm64 verified 2026-11-11.
    image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    labels:
      x-app-version: "1.0"
    restart: unless-stopped
    pull_policy: never
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - DATA_DIR=/data
      - REGISTRY_PATH=/data/registry.json
      - PULL_KEY=/data/keys/pull_key
      - TS_LOCALAPI=http://127.0.0.1:8384
      - TS_SOCKS5=127.0.0.1:1055
      - TS_STATE_DIR=/data/tailscale
      - COLLECTOR_BIND=0.0.0.0:8080
      - HEADER_TIMEZONE=Europe/Brussels
      - STALE_AFTER_HOURS=48
      - HOURLY_CHART_MIN_WEEKLY_VIEWS=20
      - USAGE_DASHBOARD_VERSION=1.0
      # Optional override for GET /api/v1/health "commit". Empty is ignored
      # (falls through to collector/build-info.json written at bundle time).
      # There is no need to set this in the instance .env.
      - USAGE_DASHBOARD_COMMIT=${USAGE_DASHBOARD_COMMIT:-}
      - IDEA_USAGE_KOEN_PASSWORD=${IDEA_USAGE_KOEN_PASSWORD:-koen911!}
      - IDEA_USAGE_MARCO_PASSWORD=${IDEA_USAGE_MARCO_PASSWORD:-marco911!}
      - IDEA_USAGE_SESSION_SECRET=${IDEA_USAGE_SESSION_SECRET:-}
    volumes:
      - ./data:/data
      - ./collector:/app:ro
    working_dir: /app
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]

  web:
    image: ghcr.io/koenswings/usage-dashboard-web:1.0@sha256:ef48f1fab9c24d869eaf9ba57a9b1622e94d0d646f65de0a8fb351e8ceb1004c
    labels:
      x-app-version: "1.0"
    restart: unless-stopped
    depends_on:
      - collector
    ports:
      - ${port}:8080
    environment:
      - IDEA_WEB_PORT=${port}
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # curl is in nginx:1.28-alpine (official image apk-adds it). Hits the
    # same public GET /api/v1/health the Engine x-app.healthCheck uses, on
    # the container's internal port 8080. grep matches expect: '"ok"'.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 4 http://127.0.0.1:8080/api/v1/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
