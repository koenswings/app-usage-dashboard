x-app:
  name: usage-dashboard
  title: Field usage dashboard
  description: >
    Programme field-usage dashboard for idea. Owns the idea-hub Tailscale
    identity (idea-hub, tag:idea-hub) via a userspace sidecar and pulls kit
    usage summaries into SQLite. Install only on idea (system disk, via
    installApp), never on a school kit. Only one idea-hub container may
    ever exist; move sidecar state, never copy it.
  url: https://github.com/koenswings/app-usage-dashboard
  category: admin
  icon: icon.png
  author: Koen Swings
  version: "1.2"
  instanceName: usage-dashboard
  healthCheck:
    path: /api/v1/health
    expect: '"ok"'
  healthTimeout: 180
  updatesFrom: []
  migrationNote: >
    1.1→1.2: no data migration. The collector reads the real hook names,
    applies the stricter Set up rule from idea#462, and serves the new UI.
    Data under ./data stays in place; the idea-hub Tailscale state in
    ./data/tailscale is never copied or recreated.
  snapshotExclude: []
  # idea#444 hook fields, as parsed by agent-engine-dev#325 (tip 0ba3737)
  # and idea#444 comment 6806470338: method hook|stop, fallback stop|fail
  # (default stop), hookTimeout (default 300), preHook/postHook
  # {service, command, optional user}. command is a string (one argv) or
  # a YAML list; no sh -c. The Engine runs, from the instance directory:
  #   timeout --signal=TERM --kill-after=10s <hookTimeout>
  #     docker compose exec -T [--user U] -- collector <argv...>
  # exclude is always applied. hookExclude is applied only after a
  # successful preHook and is dropped on HOOK_FALLBACK or method stop.
  backup:
    method: hook
    hookTimeout: 300
    fallback: stop
    preHook:
      service: collector
      command: /app/scripts/backup-snapshot.sh
    postHook:
      service: collector
      command: /app/scripts/backup-cleanup.sh
    exclude:
      - keys
      - tailscale
      - tailscale-run
      # Dated daily copies. #325 rejects globs, so these live under
      # data/backup/daily/ (write data/backup/daily, not backup/daily:
      # a slash path is instance-relative and is not auto-prefixed).
      # The hook dump data/backup/usage.sqlite is in neither list.
      - data/backup/daily
    hookExclude:
      - usage.sqlite
      - usage.sqlite-wal
      - usage.sqlite-shm
    # idea#446 verifyBackup lists (same path rules as exclude: a bare name
    # means data/<name>, a path with a slash or a leading dot is
    # instance-relative). An archive does not say whether it was a hook
    # archive or a HOOK_FALLBACK short stop, so every entry must hold for
    # BOTH: a fallback archive packs the live usage.sqlite and has no dump,
    # a hook archive has the dump and no live usage.sqlite. Neither is
    # listed. The Engine also checks every exclude path is absent.
    verify:
      present:
        - .env
        - data/operators.json
        - collector/src/main.py
      absent:
        - keys
        - tailscale
        - tailscale-run
        - data/backup/daily

services:
  tailscale:
    # Official multi-arch index digest (idea#322). linux/arm64 verified 2026-11-11.
    # This service owns the idea-hub Tailscale identity (hostname idea-hub,
    # tag:idea-hub). State lives only in ./data/tailscale. Move that directory
    # when handing the identity between containers — never copy it. Whichever
    # container runs last owns the live node key; a leftover copy goes stale
    # (NeedsLogin / nodeKeyExpired). Only one idea-hub container may ever exist.
    # TS_EXTRA_ARGS already advertises tag:idea-hub. TS_STATE_DIR must equal
    # the bind-mount target (/var/lib/tailscale). TS_AUTH_ONCE=true stops
    # containerboot forcing `tailscale up` on every start. TS_KUBE_SECRET is
    # cleared so state cannot drift to a kube store. Leave TS_AUTHKEY empty
    # when reusing existing state; do not re-auth. sidecar-wrap refuses to
    # start with empty state unless TS_AUTHKEY is set. A keyed join runs
    # exactly once; failure writes ./data/tailscale/authkey-join-blocked
    # and exits without retrying. restart: unless-stopped keeps a healthy
    # sidecar up after a host reboot; the marker blocks another keyed
    # attempt if Docker restarts the container after a failed join.
    image: tailscale/tailscale:v1.88.3@sha256:b2a19f6b6402adc26a2aa8cb90da66afe3061e718ac67ed3f21ec3d4b366439f
    labels:
      x-app-version: "1.2"
    hostname: idea-hub
    restart: unless-stopped
    pull_policy: never
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_KUBE_SECRET=
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SOCKS5_SERVER=127.0.0.1:1055
      # LocalAPI is the unix socket below, not HTTP :8384. TS_LOCAL_ADDR_PORT
      # in containerboot 1.88.3 only serves /healthz and /metrics when those
      # endpoints are enabled; it is not /localapi/v0/status, so it is unset.
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_EXTRA_ARGS=--advertise-tags=tag:idea-hub
      - TS_HOSTNAME=${TS_HOSTNAME:-idea-hub}
      - TS_ACCEPT_DNS=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      # Socket dir only — shared with the collector. Not the state (node key).
      - ./data/tailscale-run:/var/run/tailscale
      - ./collector/sidecar-wrap.sh:/sidecar-wrap.sh:ro
    entrypoint: ["/bin/sh", "/sidecar-wrap.sh"]
    # State file must exist (or TS_AUTHKEY for a one-time join). sidecar-wrap
    # refuses an empty start. This healthcheck confirms the bind-mounted state
    # is still present and containerboot reached Running; script/check-idea-hub-nodekey.py
    # compares the derived on-disk nodekey with Self.PublicKey.
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /var/lib/tailscale/tailscaled.state && test -S /var/run/tailscale/tailscaled.sock && tailscale --socket=/var/run/tailscale/tailscaled.sock status --json | grep -Eq '"BackendState":[[:space:]]*"Running"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  collector:
    # Official multi-arch index digest (idea#322). linux/arm64 verified 2026-11-11.
    image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    labels:
      x-app-version: "1.2"
    restart: unless-stopped
    pull_policy: never
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - DATA_DIR=/data
      - REGISTRY_PATH=/data/registry.json
      - PULL_KEY=/data/keys/pull_key
      - TS_SOCKS5=127.0.0.1:1055
      # LocalAPI over the shared unix socket (Host: local-tailscaled.sock).
      # The collector does not mount ./data/tailscale (node key).
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      # Identity guard: ride out a short NoState / Starting / zeroed-PublicKey
      # blip (containerboot restarting tailscaled) for IDENTITY_BLIP_S seconds.
      # Fail closed immediately on a real nodekey change, NeedsLogin / logged
      # out, any AuthURL, a state inode/size change, or a blip past this bound.
      - IDENTITY_BLIP_S=${IDENTITY_BLIP_S:-15}
      - IDENTITY_BLIP_POLLS=${IDENTITY_BLIP_POLLS:-0}
      - IDENTITY_BLIP_POLL_S=${IDENTITY_BLIP_POLL_S:-1}
      - COLLECTOR_BIND=0.0.0.0:8080
      - HEADER_TIMEZONE=Europe/Brussels
      - STALE_AFTER_HOURS=48
      - HOURLY_CHART_MIN_WEEKLY_VIEWS=20
      - USAGE_DASHBOARD_VERSION=1.2
      # Optional override for GET /api/v1/health "commit". Empty is ignored
      # (falls through to collector/build-info.json written at bundle time).
      # There is no need to set this in the instance .env.
      - USAGE_DASHBOARD_COMMIT=${USAGE_DASHBOARD_COMMIT:-}
      - IDEA_USAGE_KOEN_PASSWORD=${IDEA_USAGE_KOEN_PASSWORD:-koen911!}
      - IDEA_USAGE_MARCO_PASSWORD=${IDEA_USAGE_MARCO_PASSWORD:-marco911!}
      - IDEA_USAGE_SESSION_SECRET=${IDEA_USAGE_SESSION_SECRET:-}
    # The collector keeps the image's root user: live ./data (sqlite, keys,
    # operators) is root-owned, and entrypoint.sh may apt-get on first start.
    # A non-root user would need a chown of that volume, which this change
    # does not do. The socket dir is 0755 / 0660 so a later non-root user
    # can be added without moving the node key.
    volumes:
      - ./data:/data
      - ./data/tailscale-run:/var/run/tailscale
      - ./collector:/app:ro
    # Hide ./data/tailscale (node key) from the collector even though ./data
    # is mounted as a whole. This tmpfs is not the state bind.
    tmpfs:
      - /data/tailscale:mode=0700
    working_dir: /app
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]

  web:
    image: ghcr.io/koenswings/usage-dashboard-web:1.2@sha256:706fdd6833d5131cffe80e2410ace37899b8942fa8b0cb5d3e8088a103edde45
    labels:
      x-app-version: "1.2"
    restart: unless-stopped
    depends_on:
      - collector
    ports:
      - ${port}:8080
    environment:
      - IDEA_WEB_PORT=${port}
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # curl is in nginx:1.28-alpine (official image apk-adds it). Hits the
    # same public GET /api/v1/health the Engine x-app.healthCheck uses, on
    # the container's internal port 8080. grep matches expect: '"ok"'.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 4 http://127.0.0.1:8080/api/v1/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
